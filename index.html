<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scroll Controlled Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
        }

        /* Space that creates the scrolling distance */
        .scroll-section {
            height: 500vh;
            position: relative;
        }

        /* Keeps video fixed while scrolling */
        .video-container {
            position: sticky;
            top: 0;

            width: 100%;
            height: 100vh;

            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        /* Text overlay */
        .content {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            z-index: 2;

            pointer-events: none;

            text-shadow: 0 3px 20px rgba(0, 0, 0, 0.8);
        }

        .content h1 {
            font-size: clamp(40px, 8vw, 100px);
            letter-spacing: -3px;
        }

        .content p {
            margin-top: 15px;
            font-size: 18px;
            opacity: 0.8;
        }

        .scroll-indicator {
            position: absolute;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 3;

            font-size: 14px;
            opacity: 0.7;

            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translate(-50%, 0);
            }

            50% {
                transform: translate(-50%, 10px);
            }
        }

        /* Section after video */
        .after {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;

            text-align: center;
        }

        .after h2 {
            font-size: clamp(30px, 5vw, 60px);
        }
    </style>
</head>

<body>

    <!-- SCROLL CONTROLLED VIDEO -->
    <section class="scroll-section">

        <div class="video-container">

            <video
                id="scrollVideo"
                muted
                playsinline
                preload="auto"
            >
                <source src="animation.mp4" type="video/mp4">
                Your browser does not support video.
            </video>

            <div class="content">
                <h1>SCROLL</h1>
                <p>Control the animation with your scroll</p>
            </div>

            <div class="scroll-indicator">
                ↓ Scroll to explore ↓
            </div>

        </div>

    </section>


    <!-- CONTENT AFTER VIDEO -->
    <section class="after">
        <h2>The animation is complete.</h2>
    </section>


    <script>

        const video = document.getElementById("scrollVideo");
        const section = document.querySelector(".scroll-section");

        let videoReady = false;

        /*
         * Wait until the browser knows the video's duration.
         */
        video.addEventListener("loadedmetadata", () => {

            videoReady = true;

            // Start at first frame
            video.currentTime = 0;

        });


        /*
         * Convert scroll position into video progress.
         */
        function updateVideo() {

            if (!videoReady) return;

            const sectionTop = section.offsetTop;

            const sectionHeight = section.offsetHeight;

            const viewportHeight = window.innerHeight;

            const scrollPosition = window.scrollY;


            /*
             * How far we've travelled through
             * the scroll section.
             */
            let progress =
                (scrollPosition - sectionTop) /
                (sectionHeight - viewportHeight);


            /*
             * Keep progress between 0 and 1.
             */
            progress = Math.max(0, Math.min(1, progress));


            /*
             * Convert progress into video time.
             */
            const targetTime =
                progress * video.duration;


            /*
             * Change the video's frame.
             */
            video.currentTime = targetTime;
        }


        /*
         * Update while scrolling.
         */
        window.addEventListener(
            "scroll",
            updateVideo,
            { passive: true }
        );


        /*
         * Also update when the page loads/resizes.
         */
        window.addEventListener(
            "resize",
            updateVideo
        );

    </script>

</body>
</html>
